enable_audio_bell no

font_size 11.0
enabled_layouts tall:bias=66;full_size=1;mirrored=false,grid,stack

allow_remote_control yes
listen_on unix:@mykitty

map alt+j kitten pass_keys.py neighboring_window bottom alt+j
map alt+k kitten pass_keys.py neighboring_window top    alt+k
map alt+h kitten pass_keys.py neighboring_window left   alt+h
map alt+l kitten pass_keys.py neighboring_window right  alt+l

# map alt+h neighboring_window left
# map alt+l neighboring_window right
# map alt+k neighboring_window up
# map alt+j neighboring_window down

map alt+shift+h move_window left
map alt+shift+l move_window right
map alt+shift+k move_window up
map alt+shift+j move_window down

map alt+a>x close_window
map alt+a>n launch --cwd=current
map alt+a>shift+n launch --type=tab --cwd=current
map alt+a>shift+o launch --type=os-window --cwd=current

map alt+a>r load_config_file

map ctrl+u scroll_page_up
map ctrl+d scroll_page_down
map ctrl+shift+j scroll_line_down
map ctrl+shift+k scroll_line_up

map alt+a>l next_tab
map alt+a>h previous_tab

map alt+a>shift+l next_layout

# full-kitty window
map alt+a>z combine : toggle_layout stack : scroll_prompt_to_bottom
# reading mode: stack layout plus padding so the text is a centred column half the window wide; again to leave
# (kitty/reading_mode.py, linked into ~/.config/kitty by the host setup.sh; add +2 after 0.5 for a bigger font)
map alt+a>shift+z kitten reading_mode.py 0.5
tab_title_template "{'\uf002 ' if layout_name == 'stack' else ''}{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title}{' \uf002' if layout_name == 'stack' else ''}"
tab_bar_style powerline

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_KITTY_THEME
# Base2Tone Desert Dark
include current-theme.conf
# END_KITTY_THEME

# per-host additions on top of the theme: borders, tabs, sizes, decorations.
# Linked from arch/kitty or ubuntu/kitty by that host's setup.sh. Last line on purpose:
# kitty applies later directives over earlier ones.
include local-theme-overrides.conf
