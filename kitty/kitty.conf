enable_audio_bell no

font_size 11.0
enabled_layouts tall:bias=66;full_size=1;mirrored=false,grid,stack

allow_remote_control yes
listen_on unix:@mykitty

map alt+j kitten pass_keys.py neighboring_window bottom alt+j
map alt+k kitten pass_keys.py neighboring_window top    alt+k
map alt+h kitten pass_keys.py neighboring_window left   alt+h
map alt+l kitten pass_keys.py neighboring_window right  alt+l

# map alt+h neighboring_window left
# map alt+l neighboring_window right
# map alt+k neighboring_window up
# map alt+j neighboring_window down

map alt+shift+h move_window left
map alt+shift+l move_window right
map alt+shift+k move_window up
map alt+shift+j move_window down

map alt+a>x close_window
map alt+a>n launch --cwd=current
map alt+a>shift+n launch --type=tab --cwd=current
map alt+a>shift+o launch --type=os-window --cwd=current

map alt+a>r load_config_file

map ctrl+u scroll_page_up
map ctrl+d scroll_page_down
map ctrl+shift+j scroll_line_down
map ctrl+shift+k scroll_line_up

map alt+a>l next_tab
map alt+a>h previous_tab

# reorder tabs, Shift plus the switching keys, as Super+Shift+hjkl moves a window in sway
map alt+a>shift+l move_tab_forward
map alt+a>shift+h move_tab_backward

map alt+a>shift+space next_layout

# kitty scrollback in neovim (kitty-scrollback.nvim). The plugin locates itself from the
# kitten's path, so this points into nvim's plugin directory rather than ~/.config/kitty;
# kitty expands ~, so the same line works on both machines. Regenerate the kitten after a
# plugin update with: nvim --headless +KittyScrollbackGenerateKittens +qa
# The last-command-output modes need kitty's shell integration marks, on by default.
shell_integration enabled
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# whole scrollback in nvim: search, yank, send to a file. Also on kitty's own scrollback key.
map alt+a>e     kitty_scrollback_nvim
map ctrl+shift+h kitty_scrollback_nvim
# just the output of the last command
map alt+a>g     kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# ctrl+shift+right-click opens the output of the command you clicked on
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# full-kitty window, and the same with padding for reading. Both keys leave whichever
# mode is on, so Alt+a z gets out of reading mode too. kitty/reading_mode.py is linked
# into ~/.config/kitty by the host setup.sh; add +2 after the 0.5 for a bigger font.
map alt+a>z       kitten reading_mode.py zoom
map alt+a>shift+z kitten reading_mode.py 0.5
tab_title_template "{'\uf002 ' if layout_name == 'stack' else ''}{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title}{' \uf002' if layout_name == 'stack' else ''}"
tab_bar_style powerline

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_KITTY_THEME
# Base2Tone Desert Dark
include current-theme.conf
# END_KITTY_THEME

# per-host additions on top of the theme: borders, tabs, sizes, decorations.
# Linked from arch/kitty or ubuntu/kitty by that host's setup.sh. Last line on purpose:
# kitty applies later directives over earlier ones.
include local-theme-overrides.conf
