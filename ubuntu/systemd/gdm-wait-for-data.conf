# Copied to /etc/systemd/system/gdm.service.d/wait-for-data.conf by ubuntu/install.sh.
# Copied rather than linked on purpose: a symlink into /data would itself be unreadable
# at the moment systemd needs it, which is the very problem this file solves.
#
# /data carries nofail in fstab, so nothing in the boot sequence waits for it and the
# graphical session can start while the LUKS unlock is still running. Everything in $HOME
# that points into /data is then a dangling symlink: ~/.config/autostart resolves to
# nothing and no startup application runs, and ~/.config/systemd/user/lfbw.service
# fails to load.
#
# After= orders without requiring, and is satisfied even when the mount fails, so a
# missing /data delays the login screen but never blocks it.
[Unit]
After=data.mount
Wants=data.mount
