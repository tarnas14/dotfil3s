; Linux-Fake-Background-Webcam settings, read by `lfbw -c ~/.config/lfbw.ini` from lfbw-start,
; which adds the source camera (-w). Output is the v4l2loopback device below, which apps
; see as "Virtual Camera". Frames are processed only while some app reads it (on-demand).
width = 1280
height = 720
fps = 30
; 15 here halves the CPU cost again (33% of a core with the thread cap), at the price of a choppier picture
codec = MJPG
v4l2loopback-path = /dev/video10
; background effect: file=<image>, or blur=<strength>. Placeholder: the current GNOME wallpaper.
background = file=/usr/share/backgrounds/ubuntu-wallpaper-d.png
; how strict the person mask is (percent); raise if background leaks in, lower if edges get cut
threshold = 75
