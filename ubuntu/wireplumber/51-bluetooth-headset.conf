# Bluetooth headsets on GNOME. Linked as ~/.config/wireplumber/wireplumber.conf.d/51-bluetooth-headset.conf
# by ubuntu/setup.sh. Values are read by /usr/share/wireplumber/scripts/monitors/bluez.lua;
# property names come from the installed libspa-bluez5 (PipeWire 1.6).
#
# Bluetooth Classic has two exclusive profiles: A2DP (stereo output, AAC/SBC, no microphone)
# and HFP (mono in and out over SCO). Opening the microphone switches the AirPods to HFP,
# WirePlumber's auto-switch stays on for that. This file makes HFP as good as it gets:
# mSBC is 16 kHz wideband speech, CVSD the 8 kHz telephone fallback. This PipeWire build
# knows no other HFP codec. The quirk database keeps mSBC enabled for "AirPods Pro"; it
# only disables the alternate SCO packet modes (msbc-alt1), which is fine.
monitor.bluez.properties = {
    # HFP handled inside PipeWire, no oFono or hsphfpd
    bluez5.hfphsp-backend = "native"
    bluez5.enable-msbc = true
    # A2DP: SBC-XQ is the high-bitrate SBC variant, used when AAC is unavailable
    bluez5.enable-sbc-xq = true
    bluez5.enable-hw-volume = true
    # both directions of both profiles; hsp roles left out, every modern headset speaks hfp
    bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
}
