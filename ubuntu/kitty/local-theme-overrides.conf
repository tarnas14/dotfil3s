# Ubuntu: additions on top of current-theme.conf. Linked as ~/.config/kitty/local-theme-overrides.conf
# by ubuntu/setup.sh; kitty reads it last, so anything here wins over kitty.conf and the theme.
# Colours are placeholders copied from arch/kitty until the Ubuntu palette is chosen.

# borders between kitty windows, same colours as the Sway borders
window_border_width   2pt
draw_minimal_borders  yes
# active_border_color   #d98c3a
# inactive_border_color #3a1a0a
# bell_border_color     #f2b134
window_margin_width   0
window_padding_width  4

# tabs to match, the Sway workspace buttons use the same three colours
tab_bar_style           powerline
# active_tab_foreground   #1c0d05
# active_tab_background   #d98c3a
# inactive_tab_foreground #c9a97a
# inactive_tab_background #3a1a0a
# tab_bar_background      #1d2021

# GNOME draws a title bar on kitty otherwise; sway never showed one
hide_window_decorations yes
