# Ubuntu: additions on top of current-theme.conf (One Dark). Linked as
# ~/.config/kitty/local-theme-overrides.conf by ubuntu/setup.sh; kitty reads it last,
# so anything here wins over kitty.conf and the theme.
# Palette: onedarkpro "onedark" as nvim shows it. Accent is One Dark cyan #56b6c2,
# the closest scheme colour to the wallpaper's folder teal (#6db2af).

# kitty's One Dark dims the foreground to #979eab; use nvim's Normal fg instead
foreground #abb2bf

# borders between kitty windows, same colour as the Forge focus border
window_border_width   2pt
draw_minimal_borders  yes
active_border_color   #56b6c2
inactive_border_color #3e4452
bell_border_color     #e5c07b
window_margin_width   0
window_padding_width  4

# tabs in the same three colours
tab_bar_style           powerline
active_tab_foreground   #282c34
active_tab_background   #56b6c2
inactive_tab_foreground #abb2bf
inactive_tab_background #3e4452
tab_bar_background      #21252b

# GNOME draws a title bar on kitty otherwise; sway never showed one
hide_window_decorations yes
